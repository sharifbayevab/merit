[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "merit-rules"
version = "1.0.0"
description = "MERIT: interpretable module-level rule ensembles for small high-dimensional data"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-learn>=1.3"]

[tool.setuptools]
packages = ["merit"]
